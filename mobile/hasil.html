<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Hasil Skrining Kesehatan Jiwa — Puskesmas Lok Bahu</title>
    <link rel="stylesheet" href="../assets/css/mobile.css">
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/logic.js"></script>
</head>
<body x-data="mobileHasil()" x-init="init()">

    <!-- MOBILE HEADER -->
    <div class="mobile-header">
        <div class="mobile-brand">
            <img src="../assets/img/logopuskesmas.png" alt="Logo" style="height:24px;width:auto;object-fit:contain;margin-right:6px;background:rgba(255,255,255,0.9);padding:2px 4px;border-radius:4px">
            Hasil Skrining
        </div>
        <button x-show="dataSkrining" onclick="window.print()" style="color:rgba(255,255,255,.9);font-size:.78rem;background:rgba(255,255,255,0.18);border:none;cursor:pointer;padding:4px 10px;border-radius:6px">🖨 Cetak PDF</button>
    </div>

    <!-- EMPTY STATE JIKA BELUM ADA DATA -->
    <div x-show="!dataSkrining" class="content" style="text-align:center;padding:3rem 1.5rem">
        <div style="width:56px;height:56px;border-radius:14px;background:var(--indigo-100);color:var(--indigo-600);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem">
            <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        </div>
        <h3 style="font-size:1.15rem;font-weight:700;color:var(--gray-800);margin-bottom:.4rem">Belum Ada Riwayat Skrining</h3>
        <p style="font-size:.82rem;color:var(--gray-500);line-height:1.5;margin-bottom:1.25rem">Anda belum mengisi kuesioner kesehatan jiwa pada sesi browser ini. Silakan mulai skrining mandiri.</p>
        <a href="index.html" class="btn btn-primary btn-block">Mulai Skrining Mandiri →</a>
    </div>

    <!-- HASIL KONTEN -->
    <template x-if="dataSkrining">
        <div>
            <!-- HERO HASIL -->
            <div class="hasil-hero">
                <div class="hasil-badge-top" x-text="hasil.instrumenLabel||'-'"></div>
                <div class="hasil-name" x-text="dp.nama||'Pasien'"></div>
                <div class="hasil-meta" x-text="(dp.usia||'-')+' tahun • '+(dp.jenisKelamin==='L'?'Laki-laki':'Perempuan')"></div>
                <div class="hasil-meta" x-text="'Pemeriksaan: '+tglSkrining"></div>
            </div>

            <div class="content">

                <!-- ALERT Q10 EPDS -->
                <template x-if="hasil.instrumen==='epds' && hasil.q10Positif">
                    <div style="background:#fee2e2;border:2px solid #ef4444;border-radius:var(--radius-sm);padding:.85rem;margin-bottom:1rem">
                        <div style="font-weight:800;color:#991b1b;font-size:.85rem;margin-bottom:.25rem">⚠️ PERHATIAN — RUJUKAN SEGERA</div>
                        <div style="font-size:.78rem;color:#b91c1c;line-height:1.4">Terdapat indikasi pikiran mencelakai diri sendiri (EPDS No. 10). Segera hubungi petugas Puskesmas Lok Bahu.</div>
                    </div>
                </template>

                <!-- PHQ-4 GAUGE -->
                <template x-if="hasil.instrumen==='phq4'">
                    <div class="card" style="padding:1.25rem;margin-bottom:1rem;text-align:center">
                        <div style="font-size:.8rem;font-weight:700;color:var(--gray-600);text-transform:uppercase;margin-bottom:1rem">Skor Skrining PHQ-4</div>
                        <div style="display:flex;justify-content:space-around;gap:.75rem">
                            <div>
                                <div style="font-size:.75rem;font-weight:700;color:var(--gray-500);margin-bottom:.4rem">PHQ-2 Depresi</div>
                                <div style="font-size:1.75rem;font-weight:800" :style="'color:'+(hasil.hasilDepresi?.level==='danger'?'#ef4444':hasil.hasilDepresi?.level==='warning'?'#f59e0b':'#10b981')" x-text="hasil.skorDepresi"></div>
                                <div style="font-size:.7rem;color:var(--gray-400)">/ 6 skor</div>
                                <div style="font-size:.75rem;font-weight:600;margin-top:.3rem" x-text="hasil.hasilDepresi?.label"></div>
                            </div>
                            <div style="width:1px;background:var(--gray-200)"></div>
                            <div>
                                <div style="font-size:.75rem;font-weight:700;color:var(--gray-500);margin-bottom:.4rem">GAD-2 Cemas</div>
                                <div style="font-size:1.75rem;font-weight:800" :style="'color:'+(hasil.hasilKecemasan?.level==='danger'?'#ef4444':hasil.hasilKecemasan?.level==='warning'?'#f59e0b':'#10b981')" x-text="hasil.skorKecemasan"></div>
                                <div style="font-size:.7rem;color:var(--gray-400)">/ 6 skor</div>
                                <div style="font-size:.75rem;font-weight:600;margin-top:.3rem" x-text="hasil.hasilKecemasan?.label"></div>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- EPDS GAUGE -->
                <template x-if="hasil.instrumen==='epds'">
                    <div class="card" style="padding:1.25rem;margin-bottom:1rem;text-align:center">
                        <div style="font-size:.8rem;font-weight:700;color:var(--gray-600);text-transform:uppercase;margin-bottom:.6rem">Skor Total EPDS</div>
                        <div style="font-size:2.25rem;font-weight:800" :style="'color:'+(hasil.level==='danger'?'#ef4444':hasil.level==='warning'?'#f59e0b':'#10b981')" x-text="hasil.totalSkor"></div>
                        <div style="font-size:.72rem;color:var(--gray-400)">/ 30 skor maksimal</div>
                        <div style="font-size:.85rem;font-weight:700;margin-top:.4rem" :style="'color:'+(hasil.level==='danger'?'#ef4444':hasil.level==='warning'?'#f59e0b':'#10b981')" x-text="hasil.interpretasi"></div>
                    </div>
                </template>

                <!-- MINDHEAR -->
                <template x-if="hasil.instrumen==='mindhear'">
                    <div class="card" style="padding:1.25rem;margin-bottom:1rem">
                        <div style="font-size:.8rem;font-weight:700;color:var(--gray-600);text-transform:uppercase;margin-bottom:.8rem;text-align:center">Hasil Mini MINDHEAR</div>
                        <div style="display:flex;flex-direction:column;gap:.6rem">
                            <div style="padding:.65rem;border-radius:8px;background:var(--indigo-50);display:flex;justify-content:space-between;align-items:center">
                                <span style="font-size:.8rem;font-weight:600">Skala A — Ansietas</span>
                                <span style="font-size:.8rem;font-weight:700" x-text="hasil.hasilAnsietas?.label"></span>
                            </div>
                            <div style="padding:.65rem;border-radius:8px;background:var(--violet-50);display:flex;justify-content:space-between;align-items:center">
                                <span style="font-size:.8rem;font-weight:600">Skala B — Depresi</span>
                                <span style="font-size:.8rem;font-weight:700" x-text="hasil.hasilDepresi?.label"></span>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- STATUS KESIMPULAN -->
                <div class="interp-card" style="margin-bottom:1rem">
                    <div class="interp-badge" :class="hasil.berisiko ? 'warning' : 'normal'">
                        <span x-text="hasil.berisiko ? 'HASIL: BERISIKO (PERLU KONSULTASI)' : 'HASIL: TIDAK BERISIKO'"></span>
                    </div>
                    <div style="font-size:.82rem;color:var(--gray-700);line-height:1.5;margin-top:.5rem" x-text="hasil.ringkasan"></div>
                </div>

                <!-- RINGKASAN DATA -->
                <div class="card" style="margin-bottom:1.25rem">
                    <div class="card-header">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
                        Ringkasan Data Pasien
                    </div>
                    <div class="card-body" style="padding:.75rem 1rem">
                        <div class="data-row-m"><span class="data-key-m">Nama</span><span class="data-val-m" x-text="dp.nama||'-'"></span></div>
                        <div class="data-row-m"><span class="data-key-m">NIK</span><span class="data-val-m" x-text="dp.nik||'-'"></span></div>
                        <div class="data-row-m"><span class="data-key-m">Tanggal Lahir</span><span class="data-val-m" x-text="(dp.tanggalLahir||'-') + ' (' + (dp.usia||'-') + ' th)'"></span></div>
                        <div class="data-row-m"><span class="data-key-m">Jenis Kelamin</span><span class="data-val-m" x-text="dp.jenisKelamin==='L'?'Laki-laki':'Perempuan'"></span></div>
                        <div class="data-row-m"><span class="data-key-m">No. WhatsApp</span><span class="data-val-m" x-text="dp.noHp||'-'"></span></div>
                        <div class="data-row-m" x-show="dp.alamat"><span class="data-key-m">Alamat</span><span class="data-val-m" x-text="dp.alamat"></span></div>
                    </div>
                </div>

                <!-- TOMBOL AKSI LENGKAP & RAPI -->
                <div style="display:flex;flex-direction:column;gap:.65rem;margin-bottom:1.5rem">
                    <a :href="linkWA" target="_blank" class="btn btn-wa btn-block">
                        💬 Hubungi Petugas via WhatsApp
                    </a>
                    <button type="button" @click="bagikanWA()" class="btn btn-outline btn-block">
                        📲 Bagikan Hasil ke Kerabat
                    </button>
                    <button type="button" onclick="window.print()" class="btn btn-secondary btn-block">
                        🖨️ Cetak / Simpan PDF
                    </button>
                    <a href="form.html" class="btn btn-secondary btn-block">
                        🔄 Skrining Ulang / Pasien Lain
                    </a>
                </div>

                <!-- INFO PUSKESMAS -->
                <div class="footer-m">
                    <div class="footer-m-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 21v-3.375c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21M3 3h12m-.75 4.5H21m-3.75 3.75h.008v.008h-.008v-.008zm0 3h.008v.008h-.008v-.008zm0 3h.008v.008h-.008v-.008z"/></svg>
                    </div>
                    <div>
                        <div class="footer-m-name" x-text="faskesConfig.namaFaskes"></div>
                        <div class="footer-m-addr" x-text="faskesConfig.alamat"></div>
                        <div class="footer-m-addr" x-text="faskesConfig.jamLayanan" style="color:var(--indigo-600);font-weight:600;margin-top:.2rem"></div>
                    </div>
                </div>

            </div>
        </div>
    </template>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span>Beranda</span>
        </a>
        <a href="form.html?t=phq4" class="bottom-nav-item">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
            <span>Skrining</span>
        </a>
        <a href="#" class="bottom-nav-item active">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            <span>Hasil</span>
        </a>
    </nav>

    <script>
    function mobileHasil() {
        return {
            dataSkrining: null,
            dp: {},
            hasil: {},
            faskesConfig: window.FASKES_CONFIG,
            tglSkrining: '',
            linkWA: '#',

            init() {
                const raw = sessionStorage.getItem('hasilSkrining');
                if (!raw) {
                    this.dataSkrining = null;
                    return;
                }
                try {
                    const data = JSON.parse(raw);
                    this.dataSkrining = data;
                    this.dp = data.dataPasien || {};
                    this.hasil = data.hasil || {};
                    this.tglSkrining = new Date(data.waktuSkrining || Date.now()).toLocaleDateString('id-ID', {
                        day: 'numeric', month: 'long', year: 'numeric'
                    });
                    this.linkWA = this.faskesConfig.getLinkWA(this.dp, this.hasil);
                } catch(e) {
                    this.dataSkrining = null;
                }
            },

            bagikanWA() {
                const s = this.hasil.berisiko ? 'BERISIKO' : 'TIDAK BERISIKO';
                let t = `Halo, saya baru saja melakukan Skrining Kesehatan Jiwa Mandiri (%2A${this.hasil.instrumenLabel||''}%2A).%0A%0A`;
                t += `Hasil: *${s}* (${this.hasil.ringkasan||'-'})%0A`;
                t += `Faskes: *${this.faskesConfig.namaFaskes}*%0A%0A`;
                t += `Skrining gratis dapat diakses mandiri via portal Puskesmas.`;
                window.open('https://wa.me/?text=' + t, '_blank');
            }
        };
    }
    </script>
</body>
</html>
